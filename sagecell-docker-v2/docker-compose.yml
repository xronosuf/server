services:
  sagecell:
    build:
      context: .
      args:
        SAGEMATH_TAG: "10.9"
        BUILD_STATIC: "0"
    image: local/sagecell-xronos
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      - sagecell-data:/var/lib/sagecell
    environment:
      SAGECELL_MAX_KERNELS: "4"
      SAGECELL_MAX_PREFORKED: "1"
      SAGECELL_RLIMIT_CPU: "30"

volumes:
  sagecell-data:
